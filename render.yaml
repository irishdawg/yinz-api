services:
  - type: web
    name: gotiate-api
    runtime: python
    plan: free
    branch: main
    buildCommand: "uv sync --frozen"
    startCommand: "uv run uvicorn gotiate.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
